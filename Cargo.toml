[workspace]
members = [
    "crates/gloop-core",
    "crates/gloop-provider",
    "crates/gloop-runtime",
    "crates/gloop-cli",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["gloop contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.16"
dialoguer = "0.12"
directories = "6.0"
futures = "0.3"
hex = "0.4"
indexmap = { version = "2.11", features = ["serde"] }
indicatif = "0.18"
jsonschema = "0.33"
petgraph = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "1.0", features = ["chrono04", "indexmap2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1.2", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
