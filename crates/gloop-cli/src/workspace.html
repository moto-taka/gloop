const token=location.hash.slice(1);
const tr=key=>T[lang][key]||key;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(message){$('error').textContent=message;$('error').hidden=!message;}
async function api(path,body){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),25000);try{const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Gloop-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal});const value=await response.json();if(!response.ok){const error=new Error(value.error||`HTTP ${response.status}`);error.status=response.status;throw error;}return value;}finally{clearTimeout(timeout);}}
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.placeholder));document.querySelectorAll('[data-example]').forEach(el=>el.textContent=tr(el.dataset.example));$('language').textContent=lang==='ja'?'EN':'日本語';renderProfiles();renderTasks();renderWorkflow();renderHandoff();updatePreview();if(detail)renderDetail(detail);}
function renderProfiles(){for(const id of ['profile','reviewProfile']){const el=$(id),value=el.value;el.replaceChildren(new Option(setupReady?tr('chooseTool'):tr('checking'),''));profiles.filter(p=>p.enabled).forEach(p=>{const option=new Option(p.name+(p.available?'':` · ${tr('unavailable')}`),p.name);option.disabled=!p.available;el.add(option);});el.value=value;el.disabled=!setupReady||!profiles.some(p=>p.available);}if(setupReady){$('setupItems').innerHTML=profiles.map(p=>`<div class="setup-item"><span class="badge ${p.available?'completed':'blocked'}">${tr(p.available?'available':'unavailable')}</span><div><strong>${escapeHtml(p.name)}</strong><p>${escapeHtml(p.available?tr('authNote'):(p.reason||'')+' · '+tr(p.kind==='cli'?'cliSetup':'apiSetup'))}</p></div></div>`).join('');}updateModels('profile','models');updateModels('reviewProfile','reviewModels');}
function updateModels(profileId,listId){const profile=profiles.find(p=>p.name===$(profileId).value);$(listId).replaceChildren(...(profile?.models||[]).map(model=>new Option(model.label,model.id)));if(profileId==='profile'){$('catalogHint').textContent=profile?tr(profile.discovery==='ready'||profile.models.length?'catalogReady':profile.discovery==='unsupported'?'catalogUnsupported':'catalogMissing'):'';}updatePreview();}
function badge(status){return `<span class="badge ${escapeHtml(status)}">${escapeHtml(tr(status))}</span>`;}
function renderTasks(){$('taskList').innerHTML=tasks.length?tasks.map(task=>`<button class="task${task.id===selected?' selected':''}" data-id="${escapeHtml(task.id)}" aria-pressed="${task.id===selected}"><span class="task-title">${escapeHtml(task.job.request.goal)}</span><span class="task-meta">${badge(task.status)}<span>${escapeHtml(task.job.request.profile||'workflow')}</span></span></button>`).join(''):`<p class="empty-list">${escapeHtml(tr('noTasks'))}</p>`;$('taskList').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>selectTask(el.dataset.id));}
async function refreshTasks(){const result=await api('/api/tasks');tasks=result.tasks;renderTasks();if(result.errors.length)error(result.errors.map(item=>`${item.id}: ${item.error}`).join('\n'));}
function updatePreview(){const review=$('secondOpinion').checked;const calls=mode==='task'?(review?2:1):Number($('maxCalls').value);$('runLimit').textContent=`${tr('max')} ${calls} ${tr('calls')} · ${Number($('timeout').value)/60} ${tr('minutes')}`;$('pathPreview').innerHTML=mode==='task'?`${tr('request')} <span>→</span> <strong>${escapeHtml($('profile').value||tr('chooseTool'))}${$('model').value?' / '+escapeHtml($('model').value):''}</strong> ${review?'<span>→</span><strong>'+escapeHtml($('reviewProfile').value||tr('reviewTool'))+'</strong>':''} <span>→</span> ${tr('result')}`:'';const selectedWorkflow=$('workflow').value===''?null:workflows[Number($('workflow').value)];const validWorkflow=selectedWorkflow?.graph&&!selectedWorkflow.issues?.some(issue=>issue.severity==='error');$('submit').disabled=submitting||(mode==='task'?(!setupReady||!$('profile').value||(review&&!$('reviewProfile').value)):!validWorkflow);$('reviewFields').hidden=!review;$('reviewProfile').required=review&&mode==='task';}
function renderHandoff(){$('handoff').hidden=!after;$('handoffText').textContent=after?`${after.job.request.goal}\n${tr('handoffDetail')}`:'';}
function newTask(){clearTimeout(pollTimer);selectionGeneration++;selected=null;detail=null;$('result').hidden=true;$('composer').hidden=false;error('');renderTasks();$('goal').focus();}
async function selectTask(id){clearTimeout(pollTimer);selected=id;detail=null;const generation=++selectionGeneration;$('composer').hidden=true;$('result').hidden=false;$('resultTitle').textContent=tr('loading');$('nodeResults').replaceChildren();$('resultMeta').replaceChildren();$('resultError').hidden=true;['followUp','stop','copyResult','backToParent'].forEach(id=>$(id).hidden=true);renderTasks();error('');try{const value=await api(`/api/tasks/${encodeURIComponent(id)}`);if(generation!==selectionGeneration)return;detail=value;renderDetail(value);pollFailures=0;schedulePoll();}catch(e){if(generation===selectionGeneration)error(e.message);}}
function outputText(output){if(output==null)return '';if(typeof output==='string')return output;if(Array.isArray(output))return output.map(outputText).join('\n\n');if(typeof output==='object'){if(typeof output.text==='string')return output.text;if(output.output!==undefined)return outputText(output.output);}return JSON.stringify(output,null,2);}
function resultText(value){return Object.entries(value?.nodes||{}).map(([id,node])=>`[${id} · ${node.profile||''}${node.model?' / '+node.model:''}]\n${outputText(node.output)}${node.error?'\n'+node.error:''}`).join('\n\n');}
function recoveryHint(node){const kind=node.failure_class;if(kind==='provider_authentication')return tr('authRecovery');if(kind==='provider_rate_limit')return tr('rateRecovery');if(kind==='provider_timeout'||kind==='budget')return tr('timeoutRecovery');if(['provider_unavailable','provider_profile_not_found','provider_configuration','provider_process'].includes(kind))return tr('toolRecovery');return '';}
function renderDetail(value){const req=value.job.request;$('resultTitle').textContent=req.goal;$('resultStatus').className=`badge ${value.status}`;$('resultStatus').textContent=tr(value.status);$('resultMeta').replaceChildren();[value.id,new Date(value.job.created_at_ms).toLocaleString(lang==='ja'?'ja-JP':'en-US'),req.profile,req.model].filter(Boolean).forEach(item=>{const span=document.createElement('span');span.textContent=item;$('resultMeta').append(span);});$('resultError').hidden=!(value.error||value.inspection_error);$('resultError').textContent=value.error||value.inspection_error||'';const nodes=Object.entries(value.nodes||{});$('nodeResults').innerHTML=nodes.length?nodes.map(([id,node])=>`<article class="node-result"><div class="node-result-head"><strong>${escapeHtml(node.profile||id)}</strong><span>${escapeHtml(node.model||'')}</span>${badge(node.status)}</div>${node.output!=null?'<pre>'+escapeHtml(outputText(node.output))+'</pre>'+(node.output_truncated?'<p class="helper">'+escapeHtml(tr('outputTruncated'))+'</p>':''):'<div class="waiting">'+escapeHtml(tr(value.finished?'retryHint':'waiting'))+'</div>'}${recoveryHint(node)?'<div class="note">'+escapeHtml(recoveryHint(node))+'</div>':''}${node.error?'<pre class="danger">'+escapeHtml(node.error)+'</pre>':''}</article>`).join(''):`<p class="result-placeholder ${value.finished?'':'loading'}">${escapeHtml(tr(value.finished?'retryHint':'startingHint'))}</p>`;$('followUp').hidden=!value.finished||!nodes.length;$('copyResult').hidden=!nodes.some(([,node])=>node.output!=null);$('stop').hidden=value.finished;$('stop').disabled=value.status==='stopping';$('backToParent').hidden=!req.after;$('artifactPath').textContent=value.run_dir;$('events').replaceChildren(...(value.events||[]).map(event=>{const line=document.createElement('div');line.textContent=`${event.sequence} · ${event.node||'gloop'} · ${event.kind}${event.message?' · '+event.message:''}`;return line;}));$('connection').textContent=tr(value.finished?'finished':'working');}
function schedulePoll(){clearTimeout(pollTimer);if(!detail||detail.finished||document.hidden)return;if(Date.now()-detail.job.created_at_ms>(detail.job.request.timeout_seconds+45)*1000){$('connection').textContent=tr('disconnected');return;}pollTimer=setTimeout(poll,1800);}
async function poll(){const generation=selectionGeneration,id=selected;try{const value=await api(`/api/tasks/${encodeURIComponent(id)}`);if(generation!==selectionGeneration)return;detail=value;renderDetail(value);pollFailures=0;if(value.finished)await refreshTasks();else schedulePoll();}catch(e){if(generation!==selectionGeneration)return;if(++pollFailures>=3){$('connection').textContent=tr('disconnected');error(e.message);}else schedulePoll();}}
function renderWorkflow(){const selectedIndex=$('workflow').value;$('workflow').replaceChildren(new Option(tr('chooseWorkflow'),''));workflows.forEach((item,index)=>{const option=new Option(item.path,String(index));option.disabled=!item.graph;$('workflow').add(option);});$('workflow').value=selectedIndex;showWorkflow();}
function showWorkflow(){const item=$('workflow').value===''?null:workflows[Number($('workflow').value)];$('workflowHint').textContent=workflows.length?tr(item?.issues?.some(issue=>issue.severity==='error')?'workflowInvalid':'workflowHint'):tr('noWorkflows');$('workflowSteps').replaceChildren(...(item?.graph?.spec.nodes||[]).map(node=>{const li=document.createElement('li');li.textContent=`${node.label||node.id} · ${node.kind}${node.profile?' · '+node.profile:''}${node.model?' / '+node.model:''}`;return li;}));updatePreview();}
function setMode(next){mode=next;pendingSubmission=null;$('naturalTask').hidden=mode!=='task';$('savedWorkflow').hidden=mode!=='workflow';$('callsField').hidden=mode!=='workflow';$('maxCalls').disabled=mode!=='workflow';$('goal').required=mode==='task';$('profile').required=mode==='task';$('taskMode').classList.toggle('active',mode==='task');$('workflowMode').classList.toggle('active',mode==='workflow');if(mode==='workflow'){after=null;renderHandoff();}updatePreview();}
function collectRequest(){if(mode==='workflow'){const workflow=workflows[Number($('workflow').value)];return {goal:workflow.graph.spec.goal,profile:null,model:null,review_profile:null,review_model:null,after:null,graph:workflow.graph,timeout_seconds:Number($('timeout').value),max_calls:Number($('maxCalls').value)};}return {goal:$('goal').value.trim(),profile:$('profile').value||null,model:$('model').value.trim()||null,review_profile:$('secondOpinion').checked?$('reviewProfile').value:null,review_model:$('secondOpinion').checked?$('reviewModel').value.trim()||null:null,after:after?.id||null,graph:null,timeout_seconds:Number($('timeout').value),max_calls:$('secondOpinion').checked?2:1};}
$('taskForm').onsubmit=async event=>{event.preventDefault();if(submitting)return;const request=collectRequest();if(!request.goal&&!request.graph){error(tr('emptyGoal'));return;}if(!pendingSubmission||JSON.stringify(pendingSubmission.request)!==JSON.stringify(request))pendingSubmission={request,id:crypto.randomUUID()};submitting=true;$('taskFields').disabled=true;$('submit').textContent=tr('sending');updatePreview();error('');try{const value=await api('/api/tasks',pendingSubmission);pendingSubmission=null;after=null;$('goal').value='';renderHandoff();await selectTask(value.id);try{await refreshTasks();}catch(e){error(e.message);}}catch(e){error(e.status?e.message:`${e.message}\n${tr('submissionUnknown')}`);}finally{submitting=false;$('taskFields').disabled=false;$('submit').textContent=tr('start');updatePreview();}};
$('newTask').onclick=()=>{after=null;pendingSubmission=null;renderHandoff();newTask();};$('clearHandoff').onclick=()=>{after=null;pendingSubmission=null;renderHandoff();};$('followUp').onclick=()=>{after=detail;setMode('task');$('goal').value='';$('secondOpinion').checked=false;pendingSubmission=null;renderHandoff();newTask();updatePreview();};$('backToParent').onclick=()=>selectTask(detail.job.request.after);
$('stop').onclick=async()=>{const id=selected,generation=selectionGeneration;$('stop').disabled=true;try{const value=await api(`/api/tasks/${encodeURIComponent(id)}/stop`,{});if(generation===selectionGeneration){detail=value;renderDetail(value);schedulePoll();}}catch(e){error(e.message);$('stop').disabled=false;}};
$('copyResult').onclick=async()=>{try{await navigator.clipboard.writeText(resultText(detail));$('connection').textContent=tr('copied');}catch(e){error(e.message);}};
$('refresh').onclick=async()=>{error('');try{await refreshTasks();if(selected)await selectTask(selected);}catch(e){error(e.message);}};
$('retrySetup').onclick=async()=>{$('retrySetup').disabled=true;try{const value=await api('/api/providers/refresh');profiles=value.profiles;setupReady=true;renderProfiles();error(profiles.some(p=>p.available)?'':tr('noTools'));}catch(e){error(e.message);}finally{$('retrySetup').disabled=false;}};
$('language').onclick=()=>{lang=lang==='ja'?'en':'ja';translate();};$('taskMode').onclick=()=>setMode('task');$('workflowMode').onclick=()=>setMode('workflow');$('workflow').onchange=showWorkflow;
$('profile').onchange=()=>{$('model').value='';updateModels('profile','models');};$('reviewProfile').onchange=()=>{$('reviewModel').value='';updateModels('reviewProfile','reviewModels');};['model','reviewModel','secondOpinion','timeout','maxCalls'].forEach(id=>$(id).addEventListener('input',updatePreview));
document.querySelectorAll('[data-example]').forEach(button=>button.onclick=()=>{$('goal').value=tr(button.dataset.example);$('goal').focus();});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(pollTimer);else if(detail&&!detail.finished&&pollFailures<3)schedulePoll();});
async function boot(){translate();try{const info=await api('/api/workspace');lang=info.language;const parts=info.repo.split(/[\\/]/);$('projectName').textContent=parts.at(-1)||info.repo;$('projectName').title=info.repo;translate();await refreshTasks();const results=await Promise.allSettled([api('/api/providers'),api('/api/workflows')]);if(results[0].status==='fulfilled'){profiles=results[0].value.profiles;setupReady=true;renderProfiles();if(!profiles.some(p=>p.available)){$('setupDetails').open=true;error(tr('noTools'));}}else{error(results[0].reason.message);$('setupDetails').open=true;$('setupItems').textContent=results[0].reason.message;}if(results[1].status==='fulfilled'){workflows=results[1].value.workflows;renderWorkflow();}else error(results[1].reason.message);updatePreview();}catch(e){error(e.message);}}
boot();
</script>
</body>
