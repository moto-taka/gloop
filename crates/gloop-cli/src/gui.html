<body>
<a class="skip-link" href="#viewport" id="skipLink"></a>
<div class="app">
<header class="topbar">
  <div class="brand" translate="no">gloop</div><span class="crumb">/</span><input id="topName" class="flow-name" spellcheck="false" autocomplete="off" aria-label="Flow name">
  <div class="top-spacer"></div><div class="status"><span id="statusDot" class="status-dot"></span><span id="statusText"></span></div>
  <div class="toolbar"><button id="lang" class="lang-button" type="button"></button><button id="jsonToggle" class="json-button" type="button" aria-expanded="false" aria-controls="jsonPanel"></button><button id="save" class="save-button" type="button"></button><button id="close" class="close-button" type="button"></button></div>
</header>
<div class="workspace">
  <aside class="sidebar">
    <h2 id="paletteTitle" class="side-title"></h2><p id="paletteHelp" class="side-help"></p>
    <div id="palette" class="palette"></div>
    <hr class="side-divider">
    <p id="checkOne" class="tip"><span class="tip-number"><span>1</span></span><span id="tipOne"></span></p>
    <p id="checkTwo" class="tip"><span class="tip-number"><span>2</span></span><span id="tipTwo"></span></p>
    <p id="checkThree" class="tip"><span class="tip-number"><span>3</span></span><span id="tipThree"></span></p>
    <hr class="side-divider"><button id="advancedHelp" class="advanced-link" type="button"></button>
  </aside>
  <section class="canvas-wrap">
    <div class="canvas-toolbar">

function nodeList(){return graph?.spec?.nodes||[]}function selectedNode(){return nodeList().find(node=>node.id===selectedId)}function kindName(node){return tr('kindNames')[kind(node)]||kind(node)}function parseArgv(input){const args=[];let token='',started=false,state='out',escaped=false;for(const character of input){if(escaped){if(state==='double'&&character==='n')token+='\n';else if(state==='double'&&character==='t')token+='\t';else token+=character;started=true;escaped=false;continue}if(character==='\\'&&state!=='single'){escaped=true;started=true;continue}if(character==="'"&&state!=='double'){state=state==='single'?'out':'single';started=true;continue}if(character==='"'&&state!=='single'){state=state==='double'?'out':'double';started=true;continue}if(/\s/.test(character)&&state==='out'){if(started){args.push(token);token='';started=false}continue}token+=character;started=true}if(escaped)token+='\\';if(started)args.push(token);return args}function quoteArg(arg){if(/^[A-Za-z0-9_./:-]+$/.test(arg))return arg;if(!arg.includes("'"))return `'${arg}'`;return `"${arg.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\t/g,'\\t')}"`}function formatArgv(argv){return argv.map(quoteArg).join(' ')}function nodeText(node){if(typeof node?.prompt==='string')return node.prompt;if(node?.prompt?.file)return node.prompt.file;if(node?.message)return node.message;if(Array.isArray(node?.argv))return formatArgv(node.argv);return ''}function preview(node){const value=nodeText(node).replace(/\s+/g,' ').trim();return value||tr('emptyPreviews')[kind(node)]||'…'}

changeEdgeKind=changeEdgeKindOverride;
function wireInfoButtons(root){root.querySelectorAll('.info[data-help]').forEach(button=>{button.onclick=event=>{event.stopPropagation();openHelp(button.dataset.help,button)}})}
function changeKind(type){const node=selectedNode();if(!node||kind(node)===type)return;if(LOCKED_KINDS.has(kind(node))||LOCKED_KINDS.has(type))return;const next=fresh(node.id,type);copyCommon(node,next);graph.spec.nodes=graph.spec.nodes.map(item=>item.id===node.id?next:item);promptOriginal=null;setDirty();render();notice(lang==='ja'?'種類を変えました。':'Step type changed.')}
function applyNode(){const node=selectedNode();if(!node)return;const type=kind(node);node.label=$('nodeName').value.trim()||undefined;if(['agent','reduce','synthesize'].includes(type)){if(!promptOriginal)node.prompt=$('prompt').value;node.profile=$('profile').value||undefined;const manual=$('modelAdvanced').value.trim();const choice=$('modelChoice').value;node.model=manual||choice||undefined;rememberRuntimeModel(node.model);if(type==='agent')node.fan_out=Math.max(1,Number($('fanout').value)||1);delete node.message;delete node.argv;delete node.env}else if(['command','verify'].includes(type)){node.argv=parseArgv($('prompt').value);delete node.prompt;delete node.profile;delete node.model;delete node.fan_out}else if(type==='gate'){node.message=$('prompt').value;delete node.prompt;delete node.argv;delete node.profile;delete node.model;delete node.fan_out}}
function syncBefore(){const node=selectedNode();if(!node)return;graph.spec.edges=(graph.spec.edges||[]).filter(edge=>!(edge.to===node.id&&edge.kind==='data'));const before=$('before').value;if(before)graph.spec.edges.push({from:before,to:node.id,kind:'data'});setDirty();renderCanvas();renderInspector()}
function hasRequiredInput(node){const type=kind(node);if(['agent','reduce','synthesize'].includes(type))return typeof node.prompt==='string'?!!node.prompt.trim():!!node.prompt?.file;if(['command','verify'].includes(type))return Array.isArray(node.argv)&&node.argv.length>0&&!!node.argv[0].trim();if(type==='gate')return !!node.message?.trim();return true}
function incompleteMessage(node){const name=friendlyName(node,nodeList().indexOf(node));if(lang==='ja'){const field=kind(node)==='command'?'コマンド':kind(node)==='verify'?'検証コマンド':kind(node)==='gate'?'承認条件':'処理内容';return `「${name}」の${field}を入力してください。`}const field=kind(node)==='command'?'command':kind(node)==='verify'?'verification command':kind(node)==='gate'?'approval criteria':'instructions';return `Enter the ${field} for “${name}”.`}
function validateDraft(){if(!graph.spec.goal.trim()){selectedId=null;selectedEdge=null;render();$('statusText').textContent=tr('unsaved');notice(lang==='ja'?'保存する前に完了条件を入力してください。':'Enter the expected result before saving.',true,'graphStatus');$('goal').focus();return false}const incomplete=nodeList().find(node=>!hasRequiredInput(node));if(incomplete){selectedId=incomplete.id;selectedEdge=null;render();$('statusText').textContent=tr('unsaved');notice(incompleteMessage(incomplete),true);$('prompt').focus();return false}return true}
async function save(){if(saving)return;if(jsonOpen&&jsonError){renderJsonStatus(tr('jsonInvalid'),true);$('jsonEditor').focus();return}saving=true;$('save').disabled=true;$('close').disabled=true;$('statusText').textContent=tr('saving');const revision=draftRevision;try{applyNode();graph.metadata.name=$('topName').value.trim()||$('name').value.trim();graph.metadata.description=$('description').value.trim()||undefined;graph.spec.goal=$('goal').value.trim();graph.spec.policies=graph.spec.policies||{};graph.spec.policies.max_parallel=Math.max(1,Number($('parallel').value)||1);if(!validateDraft())return;await api('/api/save',{method:'POST',body:JSON.stringify({graph})});if(revision===draftRevision){setSaved();notice(tr('saved'));render()}else{notice(tr('saved'))}}catch(error){$('statusText').textContent=tr('unsaved');notice(error.message,true)}finally{saving=false;$('save').disabled=false;$('close').disabled=false}}
async function closeEditor(){if(saving)return;if(dirty&&!window.confirm(tr('unsavedClose')))return;try{await api('/api/close',{method:'POST'})}catch(error){notice(error.message,true)}}
function setupEvents(){$('viewport').addEventListener('pointerdown',startPan);$('viewport').addEventListener('dragover',event=>event.preventDefault());$('viewport').addEventListener('drop',event=>{event.preventDefault();const type=event.dataTransfer.getData('application/x-gloop-kind');if(!type)return;const rect=$('viewport').getBoundingClientRect();addNode(type,(event.clientX-rect.left-pan.x)/scale-112,(event.clientY-rect.top-pan.y)/scale-56)});$('zoomIn').onclick=()=>zoom(1.15);$('zoomOut').onclick=()=>zoom(.87);$('zoomReset').onclick=()=>{scale=1;pan={x:0,y:0};renderCanvas()};$('fit').onclick=fitCanvas;$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';$('nodeStatus').textContent='';$('graphStatus').textContent='';if($('edgeStatus'))$('edgeStatus').textContent='';if(typeof closeHelp==='function')closeHelp();if(typeof closeStepChooser==='function')closeStepChooser();renderText();render()};$('save').onclick=save;$('close').onclick=closeEditor;$('remove').onclick=removeNode;$('before').onchange=syncBefore;$('kind').onchange=event=>changeKind(event.target.value);$('nodeName').oninput=()=>{applyNode();setDirty();renderCanvas()};$('prompt').oninput=()=>{if(!promptOriginal){applyNode();setDirty();renderCanvas()}};$('profile').onchange=()=>{const node=selectedNode();const previousProfile=node?.profile||'';const newProfile=$('profile').value||'';if(node&&previousProfile!==newProfile){$('modelAdvanced').value='';$('modelChoice').value=''}applyNode();renderModels(node);renderModelNote(node);setDirty();renderCanvas()};$('modelChoice').onchange=()=>{$('modelAdvanced').value='';applyNode();renderModelNote(selectedNode());setDirty();renderCanvas()};$('modelAdvanced').oninput=()=>{if($('modelAdvanced').value.trim())$('modelChoice').value='';applyNode();renderModelNote(selectedNode());setDirty();renderCanvas()};$('fanout').oninput=()=>{applyNode();setDirty();renderCanvas()};$('name').oninput=()=>{$('topName').value=$('name').value;graph.metadata.name=$('name').value;setDirty()};$('topName').oninput=()=>{$('name').value=$('topName').value;graph.metadata.name=$('topName').value;setDirty()};$('goal').oninput=()=>{graph.spec.goal=$('goal').value;setDirty();renderChecklist()};$('description').oninput=()=>{graph.metadata.description=$('description').value||undefined;setDirty()};$('parallel').oninput=()=>{graph.spec.policies=graph.spec.policies||{};graph.spec.policies.max_parallel=Math.max(1,Number($('parallel').value)||1);setDirty()};$('addEdge').onclick=()=>{const from=$('edgeFrom').value,to=$('edgeTo').value,type=$('edgeKind').value;if(!from||!to||from===to){notice(tr('different'),true);return}graph.spec.edges=graph.spec.edges||[];if(graph.spec.edges.some(edge=>edge.from===from&&edge.to===to&&edge.kind===type)){notice(tr('duplicate'),true);return}if(type==='data'&&wouldCreateCycle(from,to)){notice(tr('cycleBlocked'),true);return}graph.spec.edges.push({from,to,kind:type});setDirty();renderCanvas();renderInspector();renderChecklist();notice(tr('connected'))};$('advancedHelp').onclick=()=>document.querySelector('details.advanced')?.setAttribute('open','open');window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}})}
function setupUiEvents(){if($('jsonToggle'))$('jsonToggle').onclick=toggleJsonEditor;if($('jsonClose'))$('jsonClose').onclick=closeJsonEditor;if($('jsonFormat'))$('jsonFormat').onclick=formatJsonEditor;if($('jsonEditor'))$('jsonEditor').oninput=applyJsonText;if($('addStepBtn'))$('addStepBtn').onclick=event=>openStepChooser(event.currentTarget);if($('canvasInfo'))$('canvasInfo').onclick=event=>openHelp('canvas',event.currentTarget);if($('helpClose'))$('helpClose').onclick=closeHelp;if($('edgeRemove'))$('edgeRemove').onclick=removeSelectedEdge;['beforeInfo','profileInfo','kindInfo','edgesInfo','edgeConceptInfo','parallelInfo'].forEach(id=>{const button=$(id);if(button)button.onclick=event=>{event.stopPropagation();openHelp(button.dataset.help,button)}});document.addEventListener('click',event=>{if(!event.target.closest('#helpPopover')&&!event.target.closest('.info'))closeHelp();if(!event.target.closest('#stepChooser')&&!event.target.closest('#addStepBtn')&&!event.target.closest('.empty-canvas-btn')&&!event.target.closest('.edge-insert'))closeStepChooser()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(connectingFrom){cancelConnecting();return}if(helpTopic){closeHelp();return}if($('stepChooser')&&!$('stepChooser').classList.contains('hidden')){closeStepChooser();return}if(legendOpen){legendOpen=false;renderEdgeLegend();return}if(jsonOpen){closeJsonEditor();return}selectedId=null;selectedEdge=null;renderInspector();renderCanvas();return}if(isFormFocused())return;if((event.key==='Delete'||event.key==='Backspace')&&(selectedId||selectedEdge!==null)){event.preventDefault();if(selectedEdge!==null)removeSelectedEdge();else removeNode();return}if(event.key==='i'||event.key==='I'){if(selectedEdge!==null&&$('edgeConceptInfo'))openHelp('connection',$('edgeConceptInfo'));else if(selectedId){const node=selectedNode();if(node&&LOCKED_KINDS.has(kind(node))){const button=document.querySelector('#nestedSummary .info');if(button)openHelp(kind(node),button)}}}})}
async function init(){try{state=await api('/api/state');graph=state.graph;lang=state.language==='en'?'en':'ja';profiles=state.profiles||[];runtimeModels=(state.models||[]).slice();graph.spec.nodes=graph.spec.nodes||[];graph.spec.edges=graph.spec.edges||[];graph.spec.policies=graph.spec.policies||{};selectedId=null;setupEvents();setupUiEvents();renderText();render();setSaved();setTimeout(fitCanvas,0)}catch(error){$('statusText').textContent=error.message;$('statusText').className='status-message error'}}
const rawRenderCanvas=renderCanvas;renderCanvas=function(){rawRenderCanvas();$('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`};
const rawStartPan=startPan;startPan=function(event){if(connectingFrom){cancelConnecting();return}if(!event.target.closest('.flow-node')&&!event.target.closest('.canvas-toolbar')&&!event.target.closest('.edge-insert')){selectedId=null;selectedEdge=null;renderInspector()}rawStartPan(event)};
function addEdgeFromInspector(event){event.stopImmediatePropagation();const from=$('edgeFrom').value,to=$('edgeTo').value,type=$('edgeKind').value;if(!from||!to||from===to){notice(tr('different'),true);return}graph.spec.edges=graph.spec.edges||[];if(graph.spec.edges.some(edge=>edge.from===from&&edge.to===to&&edge.kind===type)){notice(tr('duplicate'),true);return}if(wouldCreateCycle(from,to)){notice(tr('cycleBlocked'),true);return}graph.spec.edges.push({from,to,kind:type});setDirty();renderCanvas();renderInspector();renderChecklist();notice(tr('connected'))}
const rawSetupEvents=setupEvents;
setupEvents=function(){rawSetupEvents();$('addEdge').onclick=addEdgeFromInspector};
const rawRenderInspector=renderInspector;
renderInspector=function(){rawRenderInspector();const node=selectedNode();const locked=!!node&&LOCKED_KINDS.has(kind(node));$('kind').disabled=locked;$('modelAdvanced').disabled=locked;$('fanout').disabled=locked;const modelField=$('modelAdvanced').closest('.field');const fanoutField=$('fanout').closest('.field');if(modelField)modelField.classList.toggle('hidden',locked);if(fanoutField)fanoutField.classList.toggle('hidden',locked)};
function guardDeleteShortcut(event){if(event.key!=='Delete'&&event.key!=='Backspace')return;const active=document.activeElement;const canvasSelection=active?.matches?.('.edge-path')||active?.closest?.('.flow-node');const formControl=active?.matches?.('button,a,input,select,textarea,summary,[contenteditable="true"]')||active?.closest?.('button,a,input,select,textarea,summary,[contenteditable="true"]');if(!canvasSelection||formControl)event.stopImmediatePropagation()}
document.addEventListener('keydown',guardDeleteShortcut,true);
helpCopy.connection.en.body='A connection sets the running order. Its type tells you whether a result, ordering, a resource lock, or a failure condition travels across it.';
helpCopy.connection.ja.body='接続は工程の実行順を決めます。種類によって、結果を渡すか、順番だけ決めるか、資源をロックするか、失敗時だけ進むかが変わります。';
init();
