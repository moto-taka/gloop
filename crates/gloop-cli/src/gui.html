function nodeList(){return graph?.spec?.nodes||[]}function selectedNode(){return nodeList().find(node=>node.id===selectedId)}function kindName(node){return tr('kindNames')[kind(node)]||kind(node)}function nodeText(node){if(typeof node?.prompt==='string')return node.prompt;if(node?.prompt?.file)return node.prompt.file;if(node?.message)return node.message;if(Array.isArray(node?.argv))return node.argv.join(' ');return ''}function preview(node){const value=nodeText(node).replace(/\s+/g,' ').trim();return value||'—'}
function nextId(type){const base=type==='agent'?'ai':type==='command'?'command':type==='verify'?'check':'person';let id=`${base}-${nodeList().length+1}`,index=2;while(nodeList().some(node=>node.id===id))id=`${base}-${nodeList().length+index++}`;return id}
function copyCommon(source,target){['label','requires','resources','retry','timeout_seconds','workspace','context','continue_on_failure'].forEach(key=>{if(source[key]!==undefined)target[key]=source[key]})}
function ensurePositions(){nodeList().forEach((node,index)=>{if(!positions.has(node.id))positions.set(node.id,{x:110+(index%3)*280,y:135+Math.floor(index/3)*190})});for(const id of positions.keys())if(!nodeList().some(node=>node.id===id))positions.delete(id)}
function nodePos(id){return positions.get(id)||{x:110,y:135}}
function nodeCenter(id){const pos=nodePos(id);return {x:pos.x+224,y:pos.y+56}}
function setDirty(){dirty=true;$('statusDot').className='status-dot dirty';$('statusText').textContent=tr('statusDirty')}
function setSaved(){dirty=false;$('statusDot').className='status-dot saved';$('statusText').textContent=tr('statusReady')}
function notice(value,error=false,target='nodeStatus'){const element=$(target)||$('nodeStatus');element.textContent=value;element.className=`status-message${error?' error':''}`}
function renderText(){const mappings=[['paletteTitle','paletteTitle'],['paletteHelp','paletteHelp'],['tipOne','tipOne'],['tipTwo','tipTwo'],['tipThree','tipThree'],['advancedHelp','advancedHelp'],['canvasTitle','canvasTitle'],['canvasHelp','canvasHelp'],['emptyTitle','emptyTitle'],['emptyHelp','emptyHelp'],['graphEyebrow','graphEyebrow'],['graphTitle','graphTitle'],['graphSubtitle','graphSubtitle'],['graphNameLabel','graphName'],['goalLabel','goal'],['goalHelp','goalHelp'],['descriptionLabel','description'],['parallelLabel','parallel'],['nodeEyebrow','nodeEyebrow'],['typeLabel','typeLabel'],['promptLabel','prompt'],['promptHelp','promptHelp'],['beforeLabel','before'],['beforeHelp','beforeHelp'],['profileLabel','profile'],['profileHelp','profileHelp'],['modelLabel','model'],['modelHelp','modelHelp'],['advancedLabel','advanced'],['nodeIdLabel','nodeId'],['kindLabel','kind'],['modelAdvancedLabel','modelAdvanced'],['fanoutLabel','fanout'],['edgesLabel','edges'],['edgesHelp','edgesHelp'],['remove','remove'],['addEdge','addEdge']];mappings.forEach(([id,key])=>{if($(id))$(id).textContent=tr(key)});$('lang').textContent=tr('lang');$('save').textContent=tr('save');$('close').textContent=tr('close');$('topName').setAttribute('aria-label',tr('graphName'));$('zoomOut').setAttribute('aria-label',lang==='ja'?'縮小':'Zoom out');$('zoomReset').setAttribute('aria-label',lang==='ja'?'拡大率をリセット':'Reset zoom');$('zoomIn').setAttribute('aria-label',lang==='ja'?'拡大':'Zoom in');$('fit').setAttribute('aria-label',lang==='ja'?'画面に合わせる':'Fit to screen');document.documentElement.lang=lang;renderPalette();renderInspector()}
function renderPalette(){const root=$('palette');root.innerHTML='';KINDS.forEach(type=>{const button=document.createElement('button');button.type='button';button.className=`palette-item ${type}`;button.draggable=true;button.dataset.kind=type;button.innerHTML=`<span class="palette-icon">${INFO[type].icon}</span><span class="palette-text"><strong>${tr('types')[type][0]}</strong><small>${tr('types')[type][1]}</small></span>`;button.onclick=()=>addNode(type);button.ondragstart=event=>event.dataTransfer.setData('application/x-gloop-kind',type);root.append(button)})}
function render(){if(!graph)return;ensurePositions();$('topName').value=graph.metadata?.name||'';$('name').value=graph.metadata?.name||'';$('goal').value=graph.spec?.goal||'';$('description').value=graph.metadata?.description||'';$('parallel').value=graph.spec?.policies?.max_parallel||1;renderCanvas();renderInspector()}
function renderCanvas(){ensurePositions();const world=$('world');world.innerHTML='';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','connections');svg.setAttribute('viewBox','0 0 2800 1800');const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');const marker=document.createElementNS('http://www.w3.org/2000/svg','marker');marker.setAttribute('id','arrow');marker.setAttribute('markerWidth','8');marker.setAttribute('markerHeight','8');marker.setAttribute('refX','7');marker.setAttribute('refY','4');marker.setAttribute('orient','auto');const arrow=document.createElementNS('http://www.w3.org/2000/svg','path');arrow.setAttribute('d','M0,0 L8,4 L0,8 z');arrow.setAttribute('class','edge-arrow');marker.append(arrow);defs.append(marker);svg.append(defs);(graph.spec.edges||[]).forEach((edge,index)=>{const from=nodePos(edge.from),to=nodePos(edge.to);const x1=from.x+224,y1=from.y+56,x2=to.x,y2=to.y+56,curve=Math.max(60,Math.abs(x2-x1)*.45);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+curve} ${y1}, ${x2-curve} ${y2}, ${x2} ${y2}`);path.setAttribute('class',`edge-path ${edge.kind||'data'}${selectedEdge===index?' selected':''}`);path.setAttribute('marker-end','url(#arrow)');path.addEventListener('click',event=>{event.stopPropagation();selectedEdge=index;selectedId=null;renderInspector();renderCanvas()});svg.append(path)});world.append(svg);nodeList().forEach((node,index)=>{const element=document.createElement('article');const type=kind(node);const inputLabel=lang==='ja'?'前の手順から受け取る':'Input from a previous step';const outputLabel=lang==='ja'?'次の手順へつなぐ':'Connect to the next step';element.className=`flow-node${node.id===selectedId?' selected':''}`;element.dataset.id=node.id;const pos=nodePos(node.id);element.style.left=`${pos.x}px`;element.style.top=`${pos.y}px`;element.innerHTML=`<button class="port input" type="button" aria-label="${inputLabel}" title="${inputLabel}"></button><div class="node-head"><span class="node-icon ${type}">${INFO[type]?.icon||'?'}</span><span class="node-heading"><span class="node-title">${escapeHtml(friendlyName(node,index))}</span><span class="node-kind">${escapeHtml(kindName(node))}</span></span></div><div class="node-body">${escapeHtml(preview(node))}</div><button class="port output" type="button" aria-label="${outputLabel}" title="${outputLabel}"></button>`;element.addEventListener('click',event=>{if(event.target.closest('.port'))return;selectedId=node.id;selectedEdge=null;renderCanvas();renderInspector()});element.querySelector('.node-head').addEventListener('pointerdown',event=>startNodeDrag(event,node.id));element.querySelector('.port.output').addEventListener('click',event=>{event.stopPropagation();connectingFrom=node.id;showConnecting(true);renderCanvas()});element.querySelector('.port.input').addEventListener('click',event=>{event.stopPropagation();connectTo(node.id)});world.append(element)});$('zoomReset').textContent=`${Math.round(scale*100)}%`}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
function friendlyName(node,index){if(node.label?.trim())return node.label.trim();return tr('kindNames')[kind(node)]||`${tr('selected')} ${index+1}`}
function showConnecting(active){$('connectingBanner').classList.toggle('hidden',!active);if(active)$('connectingBanner').textContent=lang==='ja'?'つなぐ相手の左の●を押してください':'Click the left dot on another step'}
function connectTo(target){if(!connectingFrom)return;if(connectingFrom===target){notice(tr('different'),true);return}graph.spec.edges=graph.spec.edges||[];if(graph.spec.edges.some(edge=>edge.from===connectingFrom&&edge.to===target&&edge.kind==='data')){notice(tr('duplicate'),true);connectingFrom=null;showConnecting(false);renderCanvas();return}graph.spec.edges.push({from:connectingFrom,to:target,kind:'data'});connectingFrom=null;showConnecting(false);setDirty();renderCanvas();renderInspector();notice(tr('connected'))}
function addNode(type,x,y){const node=fresh(nextId(type),type);graph.spec.nodes.push(node);positions.set(node.id,{x:x??(120+(nodeList().length%2)*280),y:y??(150+Math.floor((nodeList().length-1)/2)*190)});selectedId=node.id;selectedEdge=null;setDirty();render();notice(tr('addMessages')[type])}
function removeNode(){const node=selectedNode();if(!node)return;graph.spec.nodes=graph.spec.nodes.filter(item=>item.id!==node.id);graph.spec.edges=(graph.spec.edges||[]).filter(edge=>edge.from!==node.id&&edge.to!==node.id);positions.delete(node.id);selectedId=null;selectedEdge=null;setDirty();render();notice(tr('deleted'))}
function startNodeDrag(event,id){if(event.button!==0)return;event.stopPropagation();const start={x:event.clientX,y:event.clientY,pos:{...nodePos(id)}};const viewport=$('viewport');const move=moveEvent=>{const pos=positions.get(id);pos.x=Math.max(20,start.pos.x+(moveEvent.clientX-start.x)/scale);pos.y=Math.max(80,start.pos.y+(moveEvent.clientY-start.y)/scale);renderCanvas()};const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);setDirty()};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);selectedId=id;selectedEdge=null;renderInspector();viewport.classList.remove('panning')}
function startPan(event){if(event.target.closest('.flow-node')||event.target.closest('.canvas-toolbar'))return;const start={x:event.clientX,y:event.clientY,pan:{...pan}};$('viewport').classList.add('panning');const move=moveEvent=>{pan.x=start.pan.x+moveEvent.clientX-start.x;pan.y=start.pan.y+moveEvent.clientY-start.y;$('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`};const up=()=>{$('viewport').classList.remove('panning');document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up)};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)}
function fitCanvas(){ensurePositions();const list=nodeList();if(!list.length){pan={x:20,y:90};scale=1;renderCanvas();return}const xs=list.map(node=>nodePos(node.id).x),ys=list.map(node=>nodePos(node.id).y);const minX=Math.min(...xs),maxX=Math.max(...xs)+224,minY=Math.min(...ys),maxY=Math.max(...ys)+112;const viewport=$('viewport'),padding=80;scale=Math.max(.55,Math.min(1.15,(viewport.clientWidth-padding*2)/(maxX-minX)));if((maxY-minY)*scale>viewport.clientHeight-padding*2)scale=Math.max(.55,Math.min(scale,(viewport.clientHeight-padding*2)/(maxY-minY)));pan={x:(viewport.clientWidth-(maxX-minX)*scale)/2-minX*scale,y:(viewport.clientHeight-(maxY-minY)*scale)/2-minY*scale};renderCanvas()}
function zoom(factor){const viewport=$('viewport'),center={x:viewport.clientWidth/2,y:viewport.clientHeight/2},old=scale;scale=Math.max(.55,Math.min(1.35,scale*factor));pan.x=center.x-(center.x-pan.x)*(scale/old);pan.y=center.y-(center.y-pan.y)*(scale/old);renderCanvas()}
function renderInspector(){const node=selectedNode();$('inspectorEmpty').classList.toggle('hidden',!!node||selectedEdge!==null);$('graphInspector').classList.toggle('hidden',!!node||selectedEdge!==null);$('nodeInspector').classList.toggle('hidden',!node||selectedEdge!==null);if(!node){if(selectedEdge!==null)renderEdgeInspector();return}const type=kind(node);$('nodeTitle').textContent=friendlyName(node,nodeList().indexOf(node));$('nodeSubtitle').textContent=kindName(node);$('nodeId').value=node.id;$('kind').value=type;renderTypeChoices(type);const packagePrompt=node.prompt&&typeof node.prompt==='object'&&node.prompt.file?node.prompt:null;promptOriginal=packagePrompt?JSON.parse(JSON.stringify(packagePrompt)):null;$('prompt').readOnly=!!packagePrompt;$('prompt').value=packagePrompt?packagePrompt.file:type==='command'||type==='verify'?(node.argv||[]).join('\n'):type==='gate'?(node.message||''):typeof node.prompt==='string'?node.prompt:'';$('promptHelp').textContent=packagePrompt?tr('packageReadonly'):type==='command'||type==='verify'?tr('commandHelp'):tr('promptHelp');$('packageNote').classList.toggle('hidden',!packagePrompt);$('packageNote').textContent=packagePrompt?`${tr('packagePrompt')} ${packagePrompt.file}`:'';const simple=['agent','reduce','synthesize'].includes(type);$('profileField').classList.toggle('hidden',!simple);$('modelField').classList.toggle('hidden',!simple);renderProfiles(node.profile);renderModels(node.model);renderBefore(node.id);$('fanout').value=node.fan_out||1;$('modelAdvanced').value=node.model||'';$('advancedNote').classList.toggle('hidden',KINDS.includes(type));$('advancedNote').textContent=type==='loop'||type==='subgraph'?tr('loopNote'):tr('advancedNode');renderEdgeList()}
function renderGraphInspector(){if(!graph)return;$('name').value=graph.metadata?.name||'';$('goal').value=graph.spec?.goal||'';$('description').value=graph.metadata?.description||'';$('parallel').value=graph.spec?.policies?.max_parallel||1}
function renderTypeChoices(current){const root=$('typeChoices');root.innerHTML='';KINDS.forEach(type=>{const button=document.createElement('button');button.type='button';button.className=`type-choice${current===type?' selected':''}`;button.innerHTML=`<strong>${tr('types')[type][0]}</strong><small>${tr('types')[type][1]}</small>`;button.onclick=()=>changeKind(type);root.append(button)})}
function renderProfiles(current){const select=$('profile');select.innerHTML='';const none=document.createElement('option');none.value='';none.textContent=tr('none');select.append(none);profiles.filter(profile=>profile.enabled).forEach(profile=>{const option=document.createElement('option');option.value=profile.name;option.textContent=profile.name;select.append(option)});if(current&&!Array.from(select.options).some(option=>option.value===current)){const option=document.createElement('option');option.value=current;option.textContent=`${current} (${lang==='ja'?'見つかりません':'unavailable'})`;option.disabled=true;select.append(option)}select.value=current||''}
function renderModels(current){const select=$('modelChoice');select.innerHTML='';const none=document.createElement('option');none.value='';none.textContent=tr('defaultModel');select.append(none);(state?.models||[]).forEach(model=>{const option=document.createElement('option');option.value=model;option.textContent=model;select.append(option)});if(current&&!Array.from(select.options).some(option=>option.value===current)){const option=document.createElement('option');option.value=current;option.textContent=`${current} (${tr('currentModel')})`;select.append(option)}select.value=current||''}
function renderBefore(id){const select=$('before');select.innerHTML='';const first=document.createElement('option');first.value='';first.textContent=tr('first');select.append(first);nodeList().forEach((node,index)=>{if(node.id===id)return;const option=document.createElement('option');option.value=node.id;option.textContent=`${index+1}. ${friendlyName(node,index)}`;select.append(option)});const incoming=(graph.spec.edges||[]).find(edge=>edge.to===id&&edge.kind==='data');select.value=incoming?.from||''}
function renderEdgeList(){const list=$('edges');list.innerHTML='';(graph.spec.edges||[]).forEach((edge,index)=>{const row=document.createElement('div');row.className='edge-row';const text=document.createElement('span');text.textContent=`${edge.from} → ${edge.to} (${edge.kind||'data'})`;const button=document.createElement('button');button.type='button';button.textContent=tr('removeEdge');button.onclick=()=>{graph.spec.edges.splice(index,1);selectedEdge=null;setDirty();renderCanvas();renderInspector();notice(tr('disconnected'))};row.append(text,button);list.append(row)});['edgeFrom','edgeTo'].forEach(id=>{const select=$(id);select.innerHTML='';nodeList().forEach(node=>{const option=document.createElement('option');option.value=node.id;option.textContent=node.id;select.append(option)})})}
function renderEdgeInspector(){renderGraphInspector();$('graphTitle').textContent=lang==='ja'?'つながりを選択中':'Connection selected';$('graphSubtitle').textContent=lang==='ja'?'右側の設定から削除できます。':'Remove it from the advanced settings on the right.';$('graphInspector').classList.remove('hidden');$('inspectorEmpty').classList.add('hidden')}
function changeKind(type){const node=selectedNode();if(!node||kind(node)===type)return;const next=fresh(node.id,type);copyCommon(node,next);graph.spec.nodes=graph.spec.nodes.map(item=>item.id===node.id?next:item);promptOriginal=null;setDirty();render();notice(lang==='ja'?'種類を変えました。':'Step type changed.')}
function applyNode(){const node=selectedNode();if(!node)return;const type=kind(node);if(promptOriginal&&['agent','reduce','synthesize'].includes(type)){node.prompt=promptOriginal;return}if(['agent','reduce','synthesize'].includes(type)){node.prompt=$('prompt').value;node.profile=$('profile').value||undefined;node.model=$('modelChoice').value||$('modelAdvanced').value.trim()||undefined;if(type==='agent')node.fan_out=Math.max(1,Number($('fanout').value)||1);delete node.message;delete node.argv;delete node.env}else if(['command','verify'].includes(type)){node.argv=$('prompt').value.split('\n').map(value=>value.trim()).filter(Boolean);delete node.prompt;delete node.profile;delete node.model;delete node.fan_out}else if(type==='gate'){node.message=$('prompt').value;delete node.prompt;delete node.argv;delete node.profile;delete node.model;delete node.fan_out}}
function syncBefore(){const node=selectedNode();if(!node)return;graph.spec.edges=(graph.spec.edges||[]).filter(edge=>!(edge.to===node.id&&edge.kind==='data'));const before=$('before').value;if(before)graph.spec.edges.push({from:before,to:node.id,kind:'data'});setDirty();renderCanvas();renderInspector()}
async function save(){if(saving)return;saving=true;$('save').disabled=true;$('statusText').textContent=tr('saving');try{applyNode();graph.metadata.name=$('topName').value.trim()||$('name').value.trim();graph.metadata.description=$('description').value.trim()||undefined;graph.spec.goal=$('goal').value.trim();graph.spec.policies=graph.spec.policies||{};graph.spec.policies.max_parallel=Math.max(1,Number($('parallel').value)||1);await api('/api/save',{method:'POST',body:JSON.stringify({graph})});setSaved();notice(tr('saved'));render()}catch(error){notice(error.message,true)}finally{saving=false;$('save').disabled=false}}
async function closeEditor(){if(dirty&&!window.confirm(tr('unsavedClose')))return;try{await api('/api/close',{method:'POST'})}catch(error){notice(error.message,true)}}
function setupEvents(){$('viewport').addEventListener('pointerdown',startPan);$('viewport').addEventListener('dragover',event=>event.preventDefault());$('viewport').addEventListener('drop',event=>{event.preventDefault();const type=event.dataTransfer.getData('application/x-gloop-kind');if(!type)return;const rect=$('viewport').getBoundingClientRect();addNode(type,(event.clientX-rect.left-pan.x)/scale-112,(event.clientY-rect.top-pan.y)/scale-56)});$('zoomIn').onclick=()=>zoom(1.15);$('zoomOut').onclick=()=>zoom(.87);$('zoomReset').onclick=()=>{scale=1;pan={x:0,y:0};renderCanvas()};$('fit').onclick=fitCanvas;$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';$('nodeStatus').textContent='';$('graphStatus').textContent='';renderText();render()};$('save').onclick=save;$('close').onclick=closeEditor;$('remove').onclick=removeNode;$('before').onchange=syncBefore;$('kind').onchange=event=>changeKind(event.target.value);$('prompt').oninput=()=>{if(!promptOriginal){applyNode();setDirty();renderCanvas()}};$('profile').onchange=()=>{applyNode();setDirty();renderCanvas()};$('modelChoice').onchange=()=>{applyNode();setDirty();renderCanvas()};$('modelAdvanced').oninput=()=>{applyNode();setDirty();renderCanvas()};$('fanout').oninput=()=>{applyNode();setDirty();renderCanvas()};$('name').oninput=()=>{$('topName').value=$('name').value;graph.metadata.name=$('name').value;setDirty()};$('topName').oninput=()=>{$('name').value=$('topName').value;graph.metadata.name=$('topName').value;setDirty()};$('goal').oninput=()=>{graph.spec.goal=$('goal').value;setDirty()};$('description').oninput=()=>{graph.metadata.description=$('description').value||undefined;setDirty()};$('parallel').oninput=()=>{graph.spec.policies=graph.spec.policies||{};graph.spec.policies.max_parallel=Math.max(1,Number($('parallel').value)||1);setDirty()};$('addEdge').onclick=()=>{const from=$('edgeFrom').value,to=$('edgeTo').value,type=$('edgeKind').value;if(!from||!to||from===to){notice(tr('different'),true);return}graph.spec.edges=graph.spec.edges||[];if(graph.spec.edges.some(edge=>edge.from===from&&edge.to===to&&edge.kind===type)){notice(tr('duplicate'),true);return}graph.spec.edges.push({from,to,kind:type});setDirty();renderCanvas();renderInspector();notice(tr('connected'))};$('advancedHelp').onclick=()=>document.querySelector('details.advanced')?.setAttribute('open','open');window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}})}
async function init(){try{state=await api('/api/state');graph=state.graph;lang=state.language==='en'?'en':'ja';profiles=state.profiles||[];graph.spec.nodes=graph.spec.nodes||[];graph.spec.edges=graph.spec.edges||[];graph.spec.policies=graph.spec.policies||{};selectedId=null;setupEvents();renderText();render();setSaved();setTimeout(fitCanvas,0)}catch(error){$('statusText').textContent=error.message;$('statusText').className='status-message error'}}
const rawRenderCanvas=renderCanvas;renderCanvas=function(){rawRenderCanvas();$('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`};
const rawStartPan=startPan;startPan=function(event){if(!event.target.closest('.flow-node')&&!event.target.closest('.canvas-toolbar')){selectedId=null;selectedEdge=null;renderInspector()}rawStartPan(event)};
init();
