function renderInspector(){const node=selectedNode();$('inspectorEmpty').classList.toggle('hidden',!!node||selectedEdge!==null);$('graphInspector').classList.toggle('hidden',!!node||selectedEdge!==null);$('nodeInspector').classList.toggle('hidden',!node||selectedEdge!==null);if(!node){if(selectedEdge!==null)renderEdgeInspector();return}const type=kind(node);$('nodeTitle').textContent=friendlyName(node,nodeList().indexOf(node));$('nodeSubtitle').textContent=tr('types')[type]?.[1]||kindName(node);$('nodeName').value=node.label||'';$('nodeName').placeholder=tr('nodeNamePlaceholders')[type]||tr('nodeNamePlaceholders').agent;$('nodeId').value=node.id;renderKindOptions(type);renderTypeChoices(type);const packagePrompt=node.prompt&&typeof node.prompt==='object'&&node.prompt.file?node.prompt:null;promptOriginal=packagePrompt?JSON.parse(JSON.stringify(packagePrompt)):null;$('prompt').readOnly=!!packagePrompt;$('prompt').value=packagePrompt?packagePrompt.file:type==='command'||type==='verify'?formatArgv(node.argv||[]):type==='gate'?(node.message||''):typeof node.prompt==='string'?node.prompt:'';$('prompt').placeholder=tr('placeholders')[type]||'';$('promptHelp').textContent=packagePrompt?tr('packageReadonly'):type==='verify'?tr('verifyHelp'):type==='command'?tr('commandHelp'):type==='gate'?tr('gateHelp'):tr('promptHelp');$('packageNote').classList.toggle('hidden',!packagePrompt);$('packageNote').textContent=packagePrompt?`${tr('packagePrompt')} ${packagePrompt.file}`:'';const simple=['agent','reduce','synthesize'].includes(type);$('profileField').classList.toggle('hidden',!simple);$('modelField').classList.toggle('hidden',!simple);renderProfiles(node.profile);renderModels(node);renderBefore(node.id);$('fanout').value=node.fan_out||1;$('advancedNote').classList.toggle('hidden',KINDS.includes(type));$('advancedNote').textContent=type==='loop'||type==='subgraph'?tr('loopNote'):tr('advancedNode');renderEdgeList()}
function renderGraphInspector(){if(!graph)return;$('name').value=graph.metadata?.name||'';$('goal').value=graph.spec?.goal||'';$('description').value=graph.metadata?.description||'';$('parallel').value=graph.spec?.policies?.max_parallel||1}
function renderTypeChoices(current){const root=$('typeChoices');root.innerHTML='';KINDS.forEach(type=>{const button=document.createElement('button');button.type='button';button.className=`type-choice${current===type?' selected':''}`;button.innerHTML=`<strong>${tr('types')[type][0]}</strong><small>${tr('types')[type][1]}</small>`;button.onclick=()=>changeKind(type);root.append(button)})}
function renderKindOptions(current){const select=$('kind');if(!select)return;const kinds=['agent','command','verify','gate','reduce','synthesize','loop','subgraph'];select.innerHTML='';kinds.forEach(type=>{const option=document.createElement('option');option.value=type;option.textContent=`${tr('kindNames')[type]||type} (${type})`;select.append(option)});select.value=current||'agent';$('kindDescription').textContent=tr('kindDescriptions')[select.value]||''}
function profileLabel(profile){const kind=tr('profileKinds')?.[profile.kind]||profile.kind||'profile';const suffix=profile.runtime_default?` (${tr('runtimeDefault')})`:'';return `${profile.name} (${kind})${suffix}`}
function renderProfiles(current){const select=$('profile');select.innerHTML='';const none=document.createElement('option');none.value='';none.textContent=tr('none');select.append(none);profiles.filter(profile=>profile.enabled).forEach(profile=>{const option=document.createElement('option');option.value=profile.name;option.textContent=profileLabel(profile);select.append(option)});if(current&&!Array.from(select.options).some(option=>option.value===current)){const option=document.createElement('option');option.value=current;option.textContent=`${current} (${lang==='ja'?'見つかりません':'unavailable'})`;option.disabled=true;select.append(option)}select.value=current||''}
function selectedProfile(){const name=$('profile')?.value||selectedNode()?.profile||'';return profiles.find(profile=>profile.name===name)||null}
function profileModels(profile){if(profile?.models?.length)return profile.models;if(!profile&&runtimeModels.length)return runtimeModels.map(id=>({id,label:id}));return []}
function rememberRuntimeModel(modelId){const trimmed=String(modelId||'').trim();if(!trimmed||$('profile')?.value)return;if(!runtimeModels.includes(trimmed))runtimeModels.push(trimmed)}
function modelLabel(model){return model.id===model.label?model.id:`${model.label} (${model.id})`}
function catalogIncludes(profile,modelId){return profileModels(profile).some(model=>model.id===modelId)}
function renderModelNote(node){const profile=selectedProfile();const current=node?.model||profile?.default_model||'';let help=tr('modelHelp');if(profile?.discovery==='unsupported')help=tr('modelHelpUnsupported');else if(profile?.discovery==='failed')help=tr('modelHelpFailed').replace('{reason}',profile.discovery_error||'?');else if(current&&!catalogIncludes(profile,current))help=tr('modelHelpCustom');$('modelHelp').textContent=help}
function renderModels(node){const select=$('modelChoice');select.innerHTML='';const none=document.createElement('option');none.value='';none.textContent=tr('defaultModel');select.append(none);const profile=selectedProfile();const current=node?.model||profile?.default_model||'';const inCatalog=current&&catalogIncludes(profile,current);const manual=inCatalog?(node?.model&&node.model!==current?'': ''):(node?.model||'');profileModels(profile).forEach(model=>{const option=document.createElement('option');option.value=model.id;option.textContent=modelLabel(model);select.append(option)});select.value=inCatalog?current:'';$('modelAdvanced').value=manual;renderModelNote(node)}
function renderBefore(id){const select=$('before');select.innerHTML='';const first=document.createElement('option');first.value='';first.textContent=tr('first');select.append(first);nodeList().forEach((node,index)=>{if(node.id===id)return;const option=document.createElement('option');option.value=node.id;option.textContent=`${index+1}. ${friendlyName(node,index)}`;select.append(option)});const incoming=(graph.spec.edges||[]).find(edge=>edge.to===id&&edge.kind==='data');select.value=incoming?.from||''}
function renderEdgeList(){const list=$('edges');list.innerHTML='';(graph.spec.edges||[]).forEach((edge,index)=>{const row=document.createElement('div');row.className='edge-row';const text=document.createElement('span');text.textContent=`${edge.from} → ${edge.to} (${edge.kind||'data'})`;const button=document.createElement('button');button.type='button';button.textContent=tr('removeEdge');button.onclick=()=>{graph.spec.edges.splice(index,1);selectedEdge=null;setDirty();renderCanvas();renderInspector();notice(tr('disconnected'))};row.append(text,button);list.append(row)});['edgeFrom','edgeTo'].forEach(id=>{const select=$(id);select.innerHTML='';nodeList().forEach(node=>{const option=document.createElement('option');option.value=node.id;option.textContent=node.id;select.append(option)})})}
function renderEdgeInspector(){renderGraphInspector();$('graphTitle').textContent=lang==='ja'?'つながりを選択中':'Connection selected';$('graphSubtitle').textContent=lang==='ja'?'右側の設定から削除できます。':'Remove it from the advanced settings on the right.';$('graphInspector').classList.remove('hidden');$('inspectorEmpty').classList.add('hidden')}
function changeKind(type){const node=selectedNode();if(!node||kind(node)===type)return;const next=fresh(node.id,type);copyCommon(node,next);graph.spec.nodes=graph.spec.nodes.map(item=>item.id===node.id?next:item);promptOriginal=null;setDirty();render();notice(lang==='ja'?'種類を変えました。':'Step type changed.')}
function applyNode(){const node=selectedNode();if(!node)return;const type=kind(node);node.label=$('nodeName').value.trim()||undefined;if(['agent','reduce','synthesize'].includes(type)){if(!promptOriginal)node.prompt=$('prompt').value;node.profile=$('profile').value||undefined;const manual=$('modelAdvanced').value.trim();const choice=$('modelChoice').value;node.model=manual||choice||undefined;rememberRuntimeModel(node.model);if(type==='agent')node.fan_out=Math.max(1,Number($('fanout').value)||1);delete node.message;delete node.argv;delete node.env}else if(['command','verify'].includes(type)){node.argv=parseArgv($('prompt').value);delete node.prompt;delete node.profile;delete node.model;delete node.fan_out}else if(type==='gate'){node.message=$('prompt').value;delete node.prompt;delete node.argv;delete node.profile;delete node.model;delete node.fan_out}}
function syncBefore(){const node=selectedNode();if(!node)return;graph.spec.edges=(graph.spec.edges||[]).filter(edge=>!(edge.to===node.id&&edge.kind==='data'));const before=$('before').value;if(before)graph.spec.edges.push({from:before,to:node.id,kind:'data'});setDirty();renderCanvas();renderInspector()}
function hasRequiredInput(node){const type=kind(node);if(['agent','reduce','synthesize'].includes(type))return typeof node.prompt==='string'?!!node.prompt.trim():!!node.prompt?.file;if(['command','verify'].includes(type))return Array.isArray(node.argv)&&node.argv.length>0&&!!node.argv[0].trim();if(type==='gate')return !!node.message?.trim();return true}
function incompleteMessage(node){const name=friendlyName(node,nodeList().indexOf(node));if(lang==='ja'){const field=kind(node)==='command'?'コマンド':kind(node)==='verify'?'検証コマンド':kind(node)==='gate'?'承認条件':'処理内容';return `「${name}」の${field}を入力してください。`}const field=kind(node)==='command'?'command':kind(node)==='verify'?'verification command':kind(node)==='gate'?'approval criteria':'instructions';return `Enter the ${field} for “${name}”.`}
function validateDraft(){if(!graph.spec.goal.trim()){selectedId=null;selectedEdge=null;render();$('statusText').textContent=tr('unsaved');notice(lang==='ja'?'保存する前に完了条件を入力してください。':'Enter the expected result before saving.',true,'graphStatus');$('goal').focus();return false}const incomplete=nodeList().find(node=>!hasRequiredInput(node));if(incomplete){selectedId=incomplete.id;selectedEdge=null;render();$('statusText').textContent=tr('unsaved');notice(incompleteMessage(incomplete),true);$('prompt').focus();return false}return true}
async function save(){if(saving)return;saving=true;$('save').disabled=true;$('close').disabled=true;$('statusText').textContent=tr('saving');const revision=draftRevision;try{applyNode();graph.metadata.name=$('topName').value.trim()||$('name').value.trim();graph.metadata.description=$('description').value.trim()||undefined;graph.spec.goal=$('goal').value.trim();graph.spec.policies=graph.spec.policies||{};graph.spec.policies.max_parallel=Math.max(1,Number($('parallel').value)||1);if(!validateDraft())return;await api('/api/save',{method:'POST',body:JSON.stringify({graph})});if(revision===draftRevision){setSaved();notice(tr('saved'));render()}else{notice(tr('saved'))}}catch(error){$('statusText').textContent=tr('unsaved');notice(error.message,true)}finally{saving=false;$('save').disabled=false;$('close').disabled=false}}
async function closeEditor(){if(saving)return;if(dirty&&!window.confirm(tr('unsavedClose')))return;try{await api('/api/close',{method:'POST'})}catch(error){notice(error.message,true)}}
function setupEvents(){$('viewport').addEventListener('pointerdown',startPan);$('viewport').addEventListener('dragover',event=>event.preventDefault());$('viewport').addEventListener('drop',event=>{event.preventDefault();const type=event.dataTransfer.getData('application/x-gloop-kind');if(!type)return;const rect=$('viewport').getBoundingClientRect();addNode(type,(event.clientX-rect.left-pan.x)/scale-112,(event.clientY-rect.top-pan.y)/scale-56)});$('zoomIn').onclick=()=>zoom(1.15);$('zoomOut').onclick=()=>zoom(.87);$('zoomReset').onclick=()=>{scale=1;pan={x:0,y:0};renderCanvas()};$('fit').onclick=fitCanvas;$('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';$('nodeStatus').textContent='';$('graphStatus').textContent='';renderText();render()};$('save').onclick=save;$('close').onclick=closeEditor;$('remove').onclick=removeNode;$('before').onchange=syncBefore;$('kind').onchange=event=>changeKind(event.target.value);$('nodeName').oninput=()=>{applyNode();setDirty();renderCanvas()};$('prompt').oninput=()=>{if(!promptOriginal){applyNode();setDirty();renderCanvas()}};$('profile').onchange=()=>{const node=selectedNode();const previousProfile=node?.profile||'';applyNode();const newProfile=$('profile').value||'';if(node&&previousProfile!==newProfile){node.model=undefined;$('modelAdvanced').value='';$('modelChoice').value='';if(!newProfile)node.profile=undefined}renderModels(node);renderModelNote(node);setDirty();renderCanvas()};$('modelChoice').onchange=()=>{if($('modelChoice').value)$('modelAdvanced').value='';else $('modelAdvanced').value='';applyNode();renderModelNote(selectedNode());setDirty();renderCanvas()};$('modelAdvanced').oninput=()=>{if($('modelAdvanced').value.trim())$('modelChoice').value='';applyNode();renderModelNote(selectedNode());setDirty();renderCanvas()};$('fanout').oninput=()=>{applyNode();setDirty();renderCanvas()};$('name').oninput=()=>{$('topName').value=$('name').value;graph.metadata.name=$('name').value;setDirty()};$('topName').oninput=()=>{$('name').value=$('topName').value;graph.metadata.name=$('topName').value;setDirty()};$('goal').oninput=()=>{graph.spec.goal=$('goal').value;setDirty()};$('description').oninput=()=>{graph.metadata.description=$('description').value||undefined;setDirty()};$('parallel').oninput=()=>{graph.spec.policies=graph.spec.policies||{};graph.spec.policies.max_parallel=Math.max(1,Number($('parallel').value)||1);setDirty()};$('addEdge').onclick=()=>{const from=$('edgeFrom').value,to=$('edgeTo').value,type=$('edgeKind').value;if(!from||!to||from===to){notice(tr('different'),true);return}graph.spec.edges=graph.spec.edges||[];if(graph.spec.edges.some(edge=>edge.from===from&&edge.to===to&&edge.kind===type)){notice(tr('duplicate'),true);return}graph.spec.edges.push({from,to,kind:type});setDirty();renderCanvas();renderInspector();notice(tr('connected'))};$('advancedHelp').onclick=()=>document.querySelector('details.advanced')?.setAttribute('open','open');window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}})}
async function init(){try{state=await api('/api/state');graph=state.graph;lang=state.language==='en'?'en':'ja';profiles=state.profiles||[];runtimeModels=(state.models||[]).slice();graph.spec.nodes=graph.spec.nodes||[];graph.spec.edges=graph.spec.edges||[];graph.spec.policies=graph.spec.policies||{};selectedId=null;setupEvents();renderText();render();setSaved();setTimeout(fitCanvas,0)}catch(error){$('statusText').textContent=error.message;$('statusText').className='status-message error'}}
const rawRenderCanvas=renderCanvas;renderCanvas=function(){rawRenderCanvas();$('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`};
const rawStartPan=startPan;startPan=function(event){if(!event.target.closest('.flow-node')&&!event.target.closest('.canvas-toolbar')){selectedId=null;selectedEdge=null;renderInspector()}rawStartPan(event)};
init();
</script>
